[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyprd"
version = "0.1.0"
description = "En lille Next-Concept Model (NCM), der former rodede produktidéer til gode PRD'er."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.2", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tinyprd = "tinyprd.cli:main"
prd = "tinyprd.cli:prd_main"

[tool.setuptools]
packages = ["tinyprd"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

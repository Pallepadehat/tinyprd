<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyPRD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
  /* ---- farver: lyst og mørkt tema ----------------------------------------- */
  :root {
    --bg: #ffffff; --ink: #0d0d0d; --muted: #6e6e6e; --faint: #9b9b9b; --line: #e5e5e5;
    --bubble: #f4f4f4; --composer: #ffffff; --hover: #f0f0f0; --send: #0d0d0d; --send-ink: #ffffff;
    --good: #10a37f; --warn: #d97706; --bad: #dc2626;
    --shadow: 0 0 0 1px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121; --ink: #ececec; --muted: #b4b4b4; --faint: #8f8f8f; --line: #3a3a3a;
      --bubble: #303030; --composer: #303030; --hover: #2f2f2f; --send: #ececec; --send-ink: #0d0d0d;
      --shadow: 0 0 0 1px rgb(255 255 255 / .06);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
  }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- top -------------------------------------------------------------------- */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; position: relative; }
  .brand { font-weight: 600; font-size: 18px; padding: 4px 8px; }
  .brand span { color: var(--faint); font-weight: 400; }
  .icon-btn { background: none; border: 0; border-radius: 8px; padding: 8px; color: var(--muted); display: inline-flex; }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .settings {
    position: absolute; right: 14px; top: 52px; z-index: 5; width: 270px; background: var(--composer);
    border-radius: 14px; box-shadow: var(--shadow), 0 12px 32px rgb(0 0 0 / .12); padding: 14px 16px; font-size: 14px;
  }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; }
  .settings input[type=range] { width: 110px; accent-color: var(--ink); }
  .settings input[type=checkbox] { accent-color: var(--ink); width: 16px; height: 16px; }
  .settings small { color: var(--faint); display: block; margin-top: 4px; line-height: 1.4; }

  /* ---- samtalen ----------------------------------------------------------------- */
  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 768px; margin: 0 auto; padding: 8px 20px 32px; }
  .msg-user { display: flex; justify-content: flex-end; margin: 24px 0; }
  .msg-user div { background: var(--bubble); border-radius: 22px; padding: 10px 18px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-bot { margin: 24px 0 40px; }

  /* Markdown i svarene */
  .md h1 { font-size: 24px; line-height: 1.3; margin: 0 0 14px; font-weight: 650; }
  .md h2 { font-size: 18px; margin: 26px 0 8px; font-weight: 600; }
  .md p { margin: 0 0 10px; }
  .md ul { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md blockquote { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
  .md table { border-collapse: collapse; font-size: 14px; margin: 0 0 6px; }
  .md td { padding: 4px 16px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }
  .md.drafting { color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 10px; color: var(--muted); }
  .act { background: none; border: 0; border-radius: 8px; padding: 6px 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .act:hover, .act[aria-pressed="true"] { background: var(--hover); color: var(--ink); }
  .meta { font-size: 13px; color: var(--faint); margin-left: 6px; }

  .panel { margin-top: 12px; padding: 16px 18px; border-radius: 16px; background: var(--bubble); font-size: 14px; }
  .panel h3 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row input[type=range] { flex: 1; accent-color: var(--ink); }
  .level-label { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .meter { display: grid; grid-template-columns: 100px 1fr 32px; align-items: center; gap: 10px; margin: 6px 0; }
  .meter i { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: block; }
  .meter em { display: block; height: 100%; background: var(--good); }
  .meter em.mid { background: var(--warn); }
  .meter em.low { background: var(--bad); }
  .panel ul { margin: 10px 0 0; padding-left: 18px; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .compare-grid .md { font-size: 13px; }
  .compare-grid .md h1 { font-size: 16px; }
  .compare-grid .md h2 { font-size: 14px; margin-top: 14px; }
  @media (max-width: 700px) { .compare-grid { grid-template-columns: 1fr; } }

  .thinking { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.6); opacity: .5; } }

  /* ---- startside (tom samtale) ----------------------------------------------- */
  body.empty .scroll { flex: 0 0 auto; }
  body.empty .dock { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 12vh; }
  .hello { text-align: center; font-size: 28px; font-weight: 500; margin: 0 0 26px; letter-spacing: -.01em; }
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .suggestion { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggestion:hover { background: var(--hover); color: var(--ink); }
  body:not(.empty) .hello, body:not(.empty) .suggestions { display: none; }

  /* ---- skrivefeltet ------------------------------------------------------------- */
  .dock { padding: 0 20px 12px; }
  .composer {
    max-width: 768px; margin: 0 auto; background: var(--composer); border-radius: 28px; box-shadow: var(--shadow);
    display: flex; align-items: flex-end; gap: 8px; padding: 10px 10px 10px 20px;
  }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; max-height: 220px; padding: 6px 0; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--faint); }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--send); color: var(--send-ink); display: grid; place-items: center; }
  .send:disabled { opacity: .25; cursor: default; }
  .fine { text-align: center; font-size: 12px; color: var(--faint); margin: 10px 0 0; }
  .fine a { color: inherit; }
</style>
</head>
<body class="empty">
  <div class="top">
    <div class="brand">TinyPRD <span>NCM</span></div>
    <div>
      <button class="icon-btn" id="new" title="Ny PRD">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="Indstillinger">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
    <div class="settings hidden" id="settings">
      <label>Kreativitet <input type="range" id="temperature" min="0" max="1.2" step="0.1" value="0"></label>
      <label id="compare-row">Sammenlign med ord-for-ord <input type="checkbox" id="compare" checked></label>
      <small id="device"></small>
    </div>
  </div>

  <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

  <div class="dock">
    <h1 class="hello">Hvilken idé skal vi forme?</h1>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Beskriv en produktidé på engelsk … eller indsæt en PRD for at få point"></textarea>
      <button class="send" id="send" type="submit" disabled title="Send">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="suggestions" id="suggestions"></div>
    <p class="fine">TinyPRD kender ca. 750 engelske ord og kan lave fejl · <a href="https://github.com/Pallepadehat/tinyprd">GitHub</a></p>
  </div>

<script>
// ===========================================================================
// Små hjælpere
// ===========================================================================
const $ = (id) => document.getElementById(id);
const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const number = (x, digits = 1) => x.toLocaleString("da-DK", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const icon = (path) => `<svg viewBox="0 0 24 24">${path}</svg>`;
const ICONS = {
  copy: icon('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>'),
  check: icon('<path d="M20 6 9 17l-5-5"/>'),
  download: icon('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'),
  layers: icon('<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>'),
  star: icon('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>'),
  compare: icon('<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>'),
};

async function api(path, body) {
  const options = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Noget gik galt.");
  return data;
}

// ===========================================================================
// En lille Markdown-renderer. Den kan præcis det, vores prd.md bruger:
// overskrifter, citat, tabel, punktlister, afsnit og **fed**.
// ===========================================================================
function renderMarkdown(markdown) {
  const inline = (s) => escape(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const html = [];
  let list = null, table = null;
  const flush = () => {
    if (list) html.push(`<ul>${list.join("")}</ul>`);
    if (table) html.push(`<table>${table.join("")}</table>`);
    list = table = null;
  };
  for (const raw of markdown.split("\n")) {
    const line = raw.trim();
    if (line.startsWith("- ")) { if (table) flush(); (list ||= []).push(`<li>${inline(line.slice(2))}</li>`); continue; }
    if (line.startsWith("|")) {
      if (list) flush();
      const cells = line.slice(1, -1).split("|").map((c) => c.trim());
      if (cells.every((c) => /^-*$/.test(c))) continue;  // overskrift-række eller skillelinje
      (table ||= []).push(`<tr>${cells.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`);
      continue;
    }
    flush();
    if (!line) continue;
    if (line.startsWith("## ")) html.push(`<h2>${inline(line.slice(3))}</h2>`);
    else if (line.startsWith("# ")) html.push(`<h1>${inline(line.slice(2))}</h1>`);
    else if (line.startsWith("> ")) html.push(`<blockquote>${inline(line.slice(2))}</blockquote>`);
    else html.push(`<p>${inline(line)}</p>`);
  }
  flush();
  return html.join("");
}

const CRITIC_NAMES = {
  problem: "Problem", outcome: "Resultat", metrics: "Succesmål", scope: "Scope",
  "non-goals": "Non-goals", questions: "Spørgsmål", brevity: "Kort og godt",
};

function renderCritic(critic) {
  const meters = Object.entries(critic.scores).map(([name, score]) => {
    const level = score >= 8 ? "" : score >= 5 ? "mid" : "low";
    return `<div class="meter"><span>${CRITIC_NAMES[name] || name}</span><i><em class="${level}" style="width:${score * 10}%"></em></i><span>${number(score)}</span></div>`;
  }).join("");
  const feedback = critic.feedback.length ? `<ul>${critic.feedback.map((f) => `<li>${escape(f)}</li>`).join("")}</ul>` : "";
  return `<h3>Kritikeren: ${number(critic.overall)} / 10</h3>${meters}${feedback}`;
}

// ===========================================================================
// Samtalen
// ===========================================================================
const thread = $("thread");
const scrollDown = () => { $("scroll").scrollTop = $("scroll").scrollHeight; };

function addUser(text) {
  document.body.classList.remove("empty");
  const node = document.createElement("div");
  node.className = "msg-user";
  node.innerHTML = `<div>${escape(text)}</div>`;
  thread.append(node);
}

function addBot() {
  const node = document.createElement("div");
  node.className = "msg-bot";
  node.innerHTML = `<span class="thinking"></span>`;
  thread.append(node);
  scrollDown();
  return node;
}

function fileName(markdown) {
  const title = (markdown.match(/^# PRD: (.+)$/m) || [, "prd"])[1];
  return `prd-${title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "prd"}.md`;
}

function download(markdown) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([markdown], { type: "text/markdown" }));
  link.download = fileName(markdown);
  link.click();
  URL.revokeObjectURL(link.href);
}

// Svar på en idé: PRD'en "kommer i fokus" niveau for niveau, og derefter
// kommer knapperne: kopier, download prd.md, lagene, kritikeren og sammenlign.
async function answerIdea(node, result) {
  const levels = result.levels;
  node.innerHTML = `<div class="md drafting"></div>`;
  const md = node.firstChild;
  for (const level of levels.slice(0, -1)) {   // groft til fint, i stedet for ord for ord
    md.innerHTML = renderMarkdown(level.markdown);
    await sleep(140);
  }
  md.classList.remove("drafting");
  md.innerHTML = renderMarkdown(result.ncm.markdown);

  const ncm = result.ncm, base = result.baseline;
  const speed = base
    ? `${ncm.nfe} forward passes · ${number(base.nfe / ncm.nfe, 0)}× færre end ord-for-ord`
    : `${ncm.nfe} forward passes · ${number(ncm.seconds * 1000, 0)} ms`;
  const unknown = result.unknown_words.length
    ? `<div class="panel">Ukendte ord blev ignoreret: <b>${result.unknown_words.map(escape).join(", ")}</b>. Prøv at omformulere.</div>` : "";

  node.insertAdjacentHTML("beforeend", `${unknown}
    <div class="actions">
      <button class="act" data-do="copy" title="Kopier Markdown">${ICONS.copy}</button>
      <button class="act" data-do="download" title="Download prd.md">${ICONS.download} prd.md</button>
      <button class="act" data-panel="levels">${ICONS.layers} Lagene</button>
      <button class="act" data-panel="critic">${ICONS.star} ${number(ncm.critic.overall)}/10</button>
      ${base ? `<button class="act" data-panel="compare">${ICONS.compare} Sammenlign</button>` : ""}
      <span class="meta">${speed}</span>
    </div>
    <div class="panel hidden" data-name="levels">
      <h3>Se PRD'en komme i fokus</h3>
      <div class="row"><input type="range" min="1" max="${levels.length}" value="${levels.length}"></div>
      <div class="level-label"></div>
    </div>
    <div class="panel hidden" data-name="critic">${renderCritic(ncm.critic)}</div>
    ${base ? `<div class="panel hidden" data-name="compare">
      <div class="compare-grid">
        <div><h3>NCM · ${ncm.nfe} passes · ${number(ncm.critic.overall)}/10</h3><div class="md">${renderMarkdown(ncm.markdown)}</div></div>
        <div><h3>Ord-for-ord · ${base.nfe} passes · ${number(base.critic.overall)}/10</h3><div class="md">${renderMarkdown(base.markdown)}</div></div>
      </div></div>` : ""}`);

  // Niveau-skyderen viser teksten efter hvert niveau i selve svaret.
  const slider = node.querySelector('[data-name="levels"] input');
  const label = node.querySelector(".level-label");
  const showLevel = (k) => {
    const last = k === levels.length;
    md.classList.toggle("drafting", !last);
    md.innerHTML = renderMarkdown(last ? ncm.markdown : levels[k - 1].markdown);
    label.textContent = `Niveau ${k} af ${levels.length} · ${levels[k - 1].codes} koder${last ? " · færdig" : ""}`;
  };
  slider.oninput = () => showLevel(Number(slider.value));
  showLevel(levels.length);

  node.querySelector(".actions").onclick = async (event) => {
    const button = event.target.closest(".act");
    if (!button) return;
    if (button.dataset.do === "copy") {
      await navigator.clipboard.writeText(ncm.markdown);
      button.innerHTML = ICONS.check;
      setTimeout(() => { button.innerHTML = ICONS.copy; }, 1500);
    } else if (button.dataset.do === "download") {
      download(ncm.markdown);
    } else {
      const panel = node.querySelector(`[data-name="${button.dataset.panel}"]`);
      const open = panel.classList.toggle("hidden") === false;
      button.setAttribute("aria-pressed", String(open));
      if (!open && button.dataset.panel === "levels") { slider.value = levels.length; showLevel(levels.length); }
    }
  };
  scrollDown();
}

async function send(text) {
  addUser(text);
  const node = addBot();
  try {
    if (text.trimStart().startsWith("#")) {   // en indsat PRD: giv den point
      const critic = await api("/api/critique", { text });
      node.innerHTML = `<div class="panel" style="margin-top:0">${renderCritic(critic)}</div>`;
    } else {
      const result = await api("/api/generate", { idea: text, temperature: Number($("temperature").value), compare: $("compare").checked });
      await answerIdea(node, result);
    }
  } catch (error) {
    node.innerHTML = `<div class="panel" style="color:var(--bad)">${escape(error.message)}</div>`;
  }
  scrollDown();
}

// ===========================================================================
// Skrivefeltet
// ===========================================================================
const input = $("input");
let busy = false;
const updateSend = () => { $("send").disabled = busy || !input.value.trim(); };
input.oninput = () => {
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight}px`;
  updateSend();
};
input.onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); $("composer").requestSubmit(); }
};
$("composer").onsubmit = async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.oninput();
  busy = true; updateSend();
  await send(text);
  busy = false; updateSend();
  input.focus();
};

$("new").onclick = () => { thread.innerHTML = ""; document.body.classList.add("empty"); input.focus(); };
$("settings-btn").onclick = (event) => { event.stopPropagation(); $("settings").classList.toggle("hidden"); };
document.addEventListener("click", (event) => {
  if (!$("settings").contains(event.target)) $("settings").classList.add("hidden");
});

// ===========================================================================
// Start: hent info om modellerne og forslag til idéer
// ===========================================================================
api("/api/info").then((info) => {
  const device = { mps: "Apple GPU", cuda: "NVIDIA GPU", cpu: "CPU" }[info.device] || info.device;
  $("device").textContent = `Kører på ${device} · ${info.levels.length} niveauer · ${info.vocab_size} ord`;
  if (!info.has_baseline) { $("compare").checked = false; $("compare-row").classList.add("hidden"); }
  $("suggestions").innerHTML = info.examples.map((idea) => `<button class="suggestion" title="${escape(idea)}">${escape(idea)}</button>`).join("");
  for (const chip of $("suggestions").children) {
    chip.onclick = () => { input.value = chip.title; input.oninput(); $("composer").requestSubmit(); };
  }
}).catch(() => { $("device").textContent = "Serveren svarer ikke."; });
input.focus();
</script>
</body>
</html>

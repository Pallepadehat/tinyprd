<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyPRD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
  /* ---- farver: lyst og mørkt tema --------------------------------------- */
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1b16; --muted: #6b665c; --line: #e4e0d6;
    --accent: #4f46e5; --accent-soft: #eef0ff; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
    --code: #f1efe9; --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f; --panel: #1d1c18; --ink: #f1eee6; --muted: #a39e92; --line: #33312b;
      --accent: #8b85ff; --accent-soft: #26244a; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --code: #262520; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  h1, h2, h3 { line-height: 1.2; margin: 0; }
  button, textarea, input { font: inherit; color: inherit; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* ---- top --------------------------------------------------------------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 30px; letter-spacing: -.02em; }
  header p { margin: 4px 0 0; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .tabs { display: flex; gap: 4px; margin: 28px 0 16px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 600; }

  /* ---- kort og knapper ----------------------------------------------------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 14px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
  }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px;
    font-size: 13px; cursor: pointer; color: var(--muted); max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 16px; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .primary {
    margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 11px 20px; font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: .6; cursor: progress; }
  .notice { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--code); font-size: 14px; }
  .notice.error { color: var(--bad); }

  /* ---- resultater ------------------------------------------------------------ */
  .results { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; margin-top: 20px; }
  .side { display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 860px) { .results { grid-template-columns: 1fr; } }

  .doc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .doc-head h2 { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

  .levels { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .levels-row { display: flex; align-items: center; gap: 12px; }
  .levels input[type=range] { flex: 1; accent-color: var(--accent); }
  .play { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 34px; height: 30px; cursor: pointer; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; margin-top: 8px; }
  .bars span { flex: 1; background: var(--line); border-radius: 3px 3px 0 0; transition: background .2s; }
  .bars span.on { background: var(--accent); }
  .level-label { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .prd section { padding: 10px 0; border-top: 1px solid var(--line); }
  .prd section:first-child { border-top: 0; padding-top: 0; }
  .prd h3 { font-size: 14px; display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .prd h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .prd p { margin: 0; }
  .prd ul { margin: 0; padding-left: 20px; }
  .prd .intent { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .prd.blurry { filter: saturate(.6); }
  pre.raw { white-space: pre-wrap; background: var(--code); padding: 14px; border-radius: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 0; }

  .score { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); flex: none; }
  .ring b { width: 60px; height: 60px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 20px; }
  .meter { display: grid; grid-template-columns: 96px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .meter i { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; display: block; }
  .meter i em { display: block; height: 100%; background: var(--good); }
  .meter i em.mid { background: var(--warn); }
  .meter i em.low { background: var(--bad); }
  .feedback { margin: 12px 0 0; padding-left: 18px; font-size: 14px; }
  .feedback li { margin: 4px 0; }

  .speed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .speed div { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .speed strong { display: block; font-size: 22px; }
  .speed small { color: var(--muted); font-size: 12px; }
  .speed .vs { grid-column: 1 / -1; font-size: 14px; background: var(--accent-soft); }

  .compare { margin-top: 20px; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .compare-grid { grid-template-columns: 1fr; } }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgb(255 255 255 / .4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>📄 TinyPRD</h1>
      <p class="muted">En lille sprogmodel, der former rodede produktidéer til PRD'er, fra groft til fint.</p>
    </div>
    <span class="badge" id="status"><span class="dot"></span>indlæser …</span>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="shape">Form en idé</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="critic">Bedøm din egen PRD</button>
  </nav>

  <!-- ===== Fane 1: form en idé ===== -->
  <div id="tab-shape">
    <div class="card">
      <label for="idea" class="muted" style="font-size:14px">Skriv en rodet produktidé (på engelsk, modellen kender ca. 750 ord)</label>
      <textarea id="idea" placeholder="what if we built a tool that …"></textarea>
      <div class="chips" id="examples"></div>
      <div class="controls">
        <label>Kreativitet
          <input type="range" id="temperature" min="0" max="1.2" step="0.1" value="0">
          <span id="temperature-value">0,0</span>
        </label>
        <label id="compare-label"><input type="checkbox" id="compare" checked> Sammenlign med ord-for-ord modellen</label>
        <button class="primary" id="go">Form idéen</button>
      </div>
      <div class="notice hidden" id="shape-notice"></div>
    </div>

    <div class="results hidden" id="results">
      <div class="card">
        <div class="doc-head">
          <h2>TinyPRD (NCM)</h2>
          <div class="seg" id="view">
            <button aria-pressed="true" data-view="pretty">Pæn</button>
            <button aria-pressed="false" data-view="raw">Rå tekst</button>
          </div>
        </div>
        <div class="levels">
          <div class="levels-row">
            <button class="play" id="play" title="Afspil niveauerne">▶</button>
            <input type="range" id="level" min="1" max="8" value="8" aria-label="Niveau">
          </div>
          <div class="bars" id="bars"></div>
          <div class="level-label" id="level-label"></div>
        </div>
        <div id="doc"></div>
      </div>

      <div class="side">
        <div class="card">
          <h2>Kritikeren</h2>
          <div id="critic"></div>
        </div>
        <div class="card">
          <h2>Hastighed</h2>
          <div class="speed" id="speed"></div>
        </div>
      </div>
    </div>

    <div class="card compare hidden" id="compare-card">
      <h2>Side om side</h2>
      <div class="compare-grid">
        <div><h3 style="margin-bottom:10px">NCM · <span class="muted" id="cmp-ncm-score"></span></h3><div id="cmp-ncm"></div></div>
        <div><h3 style="margin-bottom:10px">Ord-for-ord · <span class="muted" id="cmp-base-score"></span></h3><div id="cmp-base"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== Fane 2: bedøm din egen PRD ===== -->
  <div id="tab-critic" class="hidden">
    <div class="results" style="margin-top:0">
      <div class="card">
        <label for="own" class="muted" style="font-size:14px">Indsæt en PRD med <code>## overskrifter</code> (problem, outcome, success metrics, scope, non-goals, open questions …)</label>
        <textarea id="own" style="min-height:340px;font-family:ui-monospace,Menlo,monospace;font-size:14px"></textarea>
        <div class="controls"><button class="primary" id="rate">Giv point</button></div>
      </div>
      <div class="card"><h2>Kritikeren</h2><div id="own-critic" class="muted">Tryk på "Giv point".</div></div>
    </div>
  </div>

  <footer>
    TinyPRD er et skoleprojekt i machine learning ·
    <a href="https://github.com/Pallepadehat/tinyprd">GitHub</a> ·
    <a href="https://hazyresearch.stanford.edu/blog/2026-10-12-ncm">Next-Concept Modeling</a>
  </footer>
</main>

<script>
// ---------------------------------------------------------------------------
// Små hjælpere
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const number = (x, digits = 1) => x.toLocaleString("da-DK", { minimumFractionDigits: digits, maximumFractionDigits: digits });

async function api(path, body) {
  const response = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Noget gik galt.");
  return data;
}

// Danske navne til PRD'ens sektioner og kritikerens områder.
const SECTION_NAMES = {
  "intent": "Kort sagt", "problem": "Problem", "users": "Brugere", "outcome": "Ønsket resultat",
  "success metrics": "Succesmål", "scope": "Med i scope", "non-goals": "Ikke med",
  "appetite": "Tidsbudget", "open questions": "Åbne spørgsmål",
};
const CRITIC_NAMES = {
  problem: "Problem", outcome: "Resultat", metrics: "Succesmål", scope: "Scope",
  "non-goals": "Non-goals", questions: "Spørgsmål", brevity: "Kort og godt",
};

// ---------------------------------------------------------------------------
// Tegn en PRD-tekst som pæne sektioner. Virker også på de slørede niveauer.
// ---------------------------------------------------------------------------
function splitSections(text) {
  const sections = [];
  let current = { title: "", lines: [] };
  for (const raw of text.replace(/\s*##\s*/g, "\n## ").split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith("## ")) {
      const heading = line.slice(3);
      const known = Object.keys(SECTION_NAMES).find((name) => heading === name || heading.startsWith(name + " "));
      current = { title: known || heading, lines: [] };
      sections.push(current);
      const rest = known ? heading.slice(known.length).trim() : "";
      if (rest) current.lines.push(rest);
    } else {
      if (!sections.length) sections.push(current);
      current.lines.push(line);
    }
  }
  return sections;
}

function renderPrd(text) {
  const html = splitSections(text).map(({ title, lines }) => {
    const items = lines.map((l) => l.replace(/^-\s*/, "")).filter(Boolean);
    const isList = lines.some((l) => l.startsWith("-")) || items.length > 1;
    const body = title === "intent"
      ? `<p class="intent">${escape(items.join(" "))}</p>`
      : isList ? `<ul>${items.map((i) => `<li>${escape(i)}</li>`).join("")}</ul>`
      : `<p>${escape(items.join(" "))}</p>`;
    const name = SECTION_NAMES[title];
    const head = name ? `${name} <small>${escape(title)}</small>` : escape(title || "…");
    return `<section><h3>${head}</h3>${body}</section>`;
  }).join("");
  return `<div class="prd">${html}</div>`;
}

function renderCritic(critic) {
  const percent = critic.overall * 10;
  const meters = Object.entries(critic.scores).map(([name, score]) => {
    const level = score >= 8 ? "" : score >= 5 ? "mid" : "low";
    return `<div class="meter"><span>${CRITIC_NAMES[name] || name}</span><i><em class="${level}" style="width:${score * 10}%"></em></i><span>${number(score)}</span></div>`;
  }).join("");
  const verdict = critic.overall >= 9 ? "Flot formet PRD 🎉" : critic.overall >= 7 ? "God start, lidt at rette" : "Mangler noget af det vigtige";
  const feedback = critic.feedback.length
    ? `<ul class="feedback">${critic.feedback.map((f) => `<li>${escape(f)}</li>`).join("")}</ul>`
    : `<p class="muted" style="font-size:14px;margin:12px 0 0">Ingen bemærkninger.</p>`;
  return `<div class="score"><div class="ring" style="--p:${percent}"><b>${number(critic.overall)}</b></div>
    <div><strong>${verdict}</strong><div class="muted" style="font-size:13px">ud af 10 point</div></div></div>${meters}${feedback}`;
}

// ---------------------------------------------------------------------------
// Fane 1: form en idé
// ---------------------------------------------------------------------------
const state = { result: null, level: 8, view: "pretty", timer: null };

function showLevel(level) {
  const { result } = state;
  const levels = result.levels;
  state.level = level;
  $("level").value = level;
  const step = levels[level - 1];
  const text = level === levels.length ? result.ncm.text : step.text;
  $("doc").innerHTML = state.view === "raw" ? `<pre class="raw">${escape(text)}</pre>` : renderPrd(text);
  $("bars").innerHTML = levels.map((l, i) => `<span class="${i < level ? "on" : ""}" style="height:${18 + (i / (levels.length - 1)) * 82}%" title="niveau ${i + 1}: ${l.codes} koder"></span>`).join("");
  const description = level === levels.length ? "færdig PRD" : level === 1 ? "en sløret skitse" : "detaljerne kommer til";
  $("level-label").textContent = `Niveau ${level} af ${levels.length} · ${step.codes} koder · ${description}`;
}

function stopPlaying() {
  clearInterval(state.timer);
  state.timer = null;
  $("play").textContent = "▶";
}

$("play").onclick = () => {
  if (state.timer) return stopPlaying();
  let level = 1;
  showLevel(level);
  $("play").textContent = "❚❚";
  state.timer = setInterval(() => {
    level += 1;
    showLevel(level);
    if (level >= state.result.levels.length) stopPlaying();
  }, 700);
};
$("level").oninput = (e) => { stopPlaying(); showLevel(Number(e.target.value)); };
$("view").onclick = (e) => {
  const view = e.target.dataset.view;
  if (!view) return;
  state.view = view;
  for (const b of $("view").children) b.setAttribute("aria-pressed", String(b.dataset.view === view));
  showLevel(state.level);
};
$("temperature").oninput = (e) => { $("temperature-value").textContent = number(Number(e.target.value)); };

function renderSpeed(result) {
  const ms = (s) => s * 1000 < 10 ? number(s * 1000, 1) : number(s * 1000, 0);
  const ncm = result.ncm, base = result.baseline;
  let html = `<div><small>NCM</small><strong>${ncm.nfe}</strong><small>forward passes · ${ms(ncm.seconds)} ms</small></div>`;
  if (base) {
    html += `<div><small>Ord-for-ord</small><strong>${base.nfe}</strong><small>forward passes · ${ms(base.seconds)} ms</small></div>`;
    html += `<div class="vs">NCM brugte <b>${number(base.nfe / ncm.nfe, 0)}× færre</b> forward passes og var <b>${number(base.seconds / ncm.seconds, 0)}× hurtigere</b>.</div>`;
  } else {
    html += `<div><small>Ord-for-ord</small><strong>–</strong><small>slå sammenligning til</small></div>`;
  }
  $("speed").innerHTML = html;
}

async function shape() {
  const idea = $("idea").value.trim();
  const notice = $("shape-notice");
  notice.className = "notice hidden";
  if (!idea) { $("idea").focus(); return; }
  stopPlaying();
  $("go").disabled = true;
  $("go").innerHTML = `<span class="spinner"></span>Former …`;
  try {
    const result = await api("/api/generate", { idea, temperature: Number($("temperature").value), compare: $("compare").checked });
    state.result = result;
    $("level").max = result.levels.length;
    $("results").classList.remove("hidden");
    showLevel(result.levels.length);
    $("critic").innerHTML = renderCritic(result.ncm.critic);
    renderSpeed(result);
    if (result.unknown_words.length) {
      notice.className = "notice";
      notice.innerHTML = `Modellen kender ikke disse ord, så de blev ignoreret: <b>${result.unknown_words.map(escape).join(", ")}</b>. Prøv at omformulere, eller vælg et eksempel.`;
    }
    const base = result.baseline;
    $("compare-card").classList.toggle("hidden", !base);
    if (base) {
      $("cmp-ncm").innerHTML = renderPrd(result.ncm.text);
      $("cmp-base").innerHTML = renderPrd(base.text);
      $("cmp-ncm-score").textContent = `${number(result.ncm.critic.overall)}/10 · ${result.ncm.nfe} passes`;
      $("cmp-base-score").textContent = `${number(base.critic.overall)}/10 · ${base.nfe} passes`;
    }
    // Vis PRD'en komme i fokus første gang.
    $("play").click();
  } catch (error) {
    notice.className = "notice error";
    notice.textContent = error.message;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Form idéen";
  }
}
$("go").onclick = shape;
$("idea").onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) shape(); };

// ---------------------------------------------------------------------------
// Fane 2: bedøm din egen PRD
// ---------------------------------------------------------------------------
$("own").value = `## problem
support agents spend hours digging through old tickets because search only matches exact titles.
## outcome
agents find the right past ticket in seconds.
## success metrics
- median time to find a past ticket
- percent of searches that end with a click
## scope
- search across ticket text and comments
## open questions
- what data does the support tool already expose?`;
$("rate").onclick = async () => {
  try { $("own-critic").innerHTML = renderCritic(await api("/api/critique", { text: $("own").value })); }
  catch (error) { $("own-critic").textContent = error.message; }
};

for (const tab of document.querySelectorAll(".tab")) {
  tab.onclick = () => {
    for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t === tab));
    $("tab-shape").classList.toggle("hidden", tab.dataset.tab !== "shape");
    $("tab-critic").classList.toggle("hidden", tab.dataset.tab !== "critic");
  };
}

// ---------------------------------------------------------------------------
// Start: hent info om modellerne og eksempler på idéer
// ---------------------------------------------------------------------------
api("/api/info").then((info) => {
  const device = { mps: "Apple GPU", cuda: "NVIDIA GPU", cpu: "CPU" }[info.device] || info.device;
  $("status").innerHTML = `<span class="dot"></span>klar · ${device} · ${info.levels.length} niveauer`;
  $("examples").innerHTML = info.examples.map((idea) => `<button class="chip" title="${escape(idea)}">${escape(idea)}</button>`).join("");
  for (const chip of $("examples").children) chip.onclick = () => { $("idea").value = chip.title; shape(); };
  if (!info.has_baseline) { $("compare").checked = false; $("compare-label").classList.add("hidden"); }
  $("idea").value = info.examples[0];
}).catch(() => {
  $("status").innerHTML = `<span class="dot" style="background:var(--bad)"></span>serveren svarer ikke`;
});
</script>
</body>
</html>

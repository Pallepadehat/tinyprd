name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer (CPU-udgave af PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff (kodestil)
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: Hele pipelinen på mini-størrelse
        run: |
          tinyprd data --preset smoke
          tinyprd train-all --preset smoke
          tinyprd evaluate --n 4
